services:
  # ---------------------------------------------------------------------------
  # Production Standalone Server (Default)
  # Uses the optimized standalone build and host routing for custom local endpoints.
  # ---------------------------------------------------------------------------
  learnharness:
    build:
      context: .
      dockerfile: Dockerfile
    image: learnharness:latest
    container_name: learnharness
    restart: unless-stopped
    ports:
      - "${LH_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - LH_DATA_DIR=/app/data
      - LH_AUTH_FILE=/app/auth-dir/auth.json
      - HOME=${HOME:-/root}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./auth-dir:/app/auth-dir
      # Docker Desktop may not be allowed to mount macOS Downloads directly.
      # Stage selected files in ./learner-files and expose them read-only at
      # the original Downloads path used in chat.
      - type: bind
        source: ./learner-files
        target: ${HOME:-/root}/Downloads
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./learner-files
        target: /root/Downloads
        read_only: true
        bind:
          create_host_path: false

  # ---------------------------------------------------------------------------
  # Live Development Mode (Profile: dev)
  # Run with: docker compose --profile dev up learnharness-dev
  # Mounts workspace directory with live Next.js Turbopack reloading.
  # ---------------------------------------------------------------------------
  learnharness-dev:
    image: node:22-bookworm-slim
    container_name: learnharness-dev
    profiles: ["dev"]
    working_dir: /app
    command: >
      sh -c "apt-get update && apt-get install -y --no-install-recommends ca-certificates &&
             npm install &&
             chmod +x docker-entrypoint.sh &&
             ./docker-entrypoint.sh npm run dev"
    ports:
      - "${LH_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - LH_DATA_DIR=/app/data
      - LH_AUTH_FILE=/app/auth.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
      - type: bind
        source: ./learner-files
        target: ${HOME}/Downloads
        read_only: true
        bind:
          create_host_path: false
